<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Tracker</title>
    <link rel="icon" type="image/x-icon" href="ChatGPT Image Feb 15, 2026, 11_33_43 PM.png">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>Assignment Tracker</h1>
          <p>Designed and Developed by Cameron Richmond</p>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <button id="navDashboard" class="nav-btn active" type="button">Dashboard</button>
          <button id="navCalendar" class="nav-btn" type="button">Calendar</button>
          <button id="navCompleted" class="nav-btn" type="button">Completed</button>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <h2 id="pageTitle">My Classes</h2>
            <p id="pageSubtitle">Track assignments and quizzes by class</p>
          </div>
          <button id="addClassBtn" class="add-class-btn" aria-label="Add class">+</button>
        </header>

        <section id="dashboardView" class="view active" aria-label="Dashboard view">
          <section class="dashboard-header">
            <h3>Classes</h3>
            <span id="classCounter" class="counter">0 / 8 classes</span>
          </section>

          <section id="classesContainer" class="classes-container"></section>
          <p id="maxNotice" class="max-notice" aria-live="polite"></p>
        </section>

        <section id="calendarView" class="view" aria-label="Calendar view" hidden>
          <section class="calendar-header">
            <button id="prevMonthBtn" type="button" class="month-btn">Prev</button>
            <h3 id="calendarMonthLabel">Month Year</h3>
            <button id="nextMonthBtn" type="button" class="month-btn">Next</button>
          </section>

          <div class="calendar-grid" id="calendarGrid"></div>
        </section>

        <section id="completedView" class="view" aria-label="Completed assignments view" hidden>
          <section class="dashboard-header">
            <h3>Completed Assignments</h3>
            <span id="completedCounter" class="counter">0 completed</span>
          </section>
          <ul id="completedList" class="completed-list"></ul>
        </section>
      </main>
    </div>

    <template id="classCardTemplate">
      <article class="class-card collapsed">
        <button class="class-summary" type="button" aria-expanded="false">
          <span class="class-title">New Class</span>
          <span class="chevron">v</span>
        </button>

        <div class="class-content" hidden>
          <div class="class-meta">
            <label>
              Class Name
              <input class="class-name-input" type="text" placeholder="e.g. Algebra II" maxlength="40" />
            </label>
            <button class="remove-class-btn" type="button">Remove Class</button>
          </div>

          <div class="grade-grid">
            <section class="grade-panel">
              <h4>Assignments</h4>
              <form class="item-form assignment-form">
                <input type="text" name="name" placeholder="Assignment name" required maxlength="50" />
                <input type="date" name="dueDate" required />
                <button type="submit">Add</button>
              </form>
              <ul class="item-list assignments-list"></ul>
            </section>
            
            <section class="grade-panel">
              <h4>Quizzes / Tests</h4>
              <form class="item-form quiz-form">
                <input type="text" name="name" placeholder="Quiz/Test name" required maxlength="50" />
                <input type="date" name="dueDate" required />
                <button type="submit">Add</button>
              </form>
              <ul class="item-list quizzes-list"></ul>
            </section>
          </div>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
